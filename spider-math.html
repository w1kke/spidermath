/* Spider-Math — comic-book UI layer over the canvas city. */

:root {
  --ink: #16121f;
  --paper: #fff8ec;
  --red: #e5352c;
  --red-dark: #b01f1a;
  --blue: #2456d6;
  --blue-deep: #1b1250;
  --yellow: #ffc933;
  --lime: #3ec24f;
  --font-display: "Bangers", "Comic Sans MS", cursive;
  --font-body: "Baloo 2", "Trebuchet MS", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-body);
  background: var(--blue-deep);
  color: var(--ink);
}

#app { position: fixed; inset: 0; }

#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hidden { display: none !important; }

/* ---------- HUD ---------- */

#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) 10px 0;
  pointer-events: none;
}

#hud button { pointer-events: auto; }

.chip-btn {
  font-family: var(--font-display);
  font-size: 1.4rem;
  line-height: 1;
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
  cursor: pointer;
}

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

// Question picking for Spider-Math — draws a random round from the 100-exercise pools.
window.SpiderQuestions = (() => {
  'use strict';

  function shuffled(arr) {
    const out = [...arr];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function getPool(grade) {
    const pool = (window.SPIDERMATH_DATA || {})[`grade${grade}`];
    if (!Array.isArray(pool) || pool.length === 0) {
      throw new Error(`No question data found for grade ${grade}`);
    }
    return pool;
  }

  // Returns `count` distinct questions: { text, answer, choices } with choices
  // freshly shuffled so replays put answers on different buildings.
  function pickRound(grade, count) {
    return shuffled(getPool(grade))
      .slice(0, count)
      .map(({ q, a, c }) => ({
        text: `${q} = ?`,
        answer: a,
        choices: shuffled(c),
      }));
  }

  return { getPool, pickRound };
})();

        const lit = hash01(b.paletteIndex, seed, r, c) < 0.56;
        ctx.fillStyle = lit ? '#ffd98a' : '#221b3f';
        ctx.fillRect(wx, wy, winW, winH);
        if (lit) {
          ctx.fillStyle = 'rgba(255,217,138,0.25)';
          ctx.fillRect(wx - 2, wy - 2, winW + 4, winH + 4);
        }
      }
    }
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSign(ctx, b, opts) {
    const signW = b.w * 0.8;
    const signH = Math.min(56, Math.max(38, b.w * 0.3));
    const sx = b.cx - signW / 2;
    const sy = b.y + 12;
    const flip = opts.flip || 0;
    const squashY = Math.abs(Math.cos(Math.PI * flip));

    ctx.save();
    ctx.translate(b.cx, sy + signH / 2);
    ctx.scale(opts.hover ? 1.06 : 1, squashY * (opts.hover ? 1.06 : 1));
    ctx.translate(-b.cx, -(sy + signH / 2));

    // Post connecting sign to roof
    ctx.fillStyle = INK;
    ctx.fillRect(b.cx - 3, sy - 10, 6, 12);

    if (opts.glow) {
      const pulse = 0.6 + 0.4 * Math.sin((opts.time || 0) * 9);
      ctx.shadowColor = `rgba(62,194,79,${pulse})`;
      ctx.shadowBlur = 24;
    }
    ctx.fillStyle = opts.glow ? '#e9ffe4' : '#fff8ec';
    roundRectPath(ctx, sx, sy, signW, signH, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = opts.glow ? '#3ec24f' : INK;
    ctx.lineWidth = opts.glow ? 5 : 3.5;
    ctx.stroke();

    const text = String(opts.number ?? '');
    let size = signH * 0.66;
    ctx.font = `${size}px Bangers, "Comic Sans MS", sans-serif`;
    const maxW = signW - 18;
    const measured = ctx.measureText(text).width;
    if (measured > maxW) {
      size *= maxW / measured;
      ctx.font = `${size}px Bangers, "Comic Sans MS", sans-serif`;
    }
    ctx.fillStyle = opts.glow ? '#1f8a30' : '#16121f';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, b.cx, sy + signH / 2 + size * 0.06);
    ctx.restore();
  }

  // ---------- Spider hero ----------

  const POSES = {
    stand: { hip: [0, -19], sh: [0, -33], head: [0, -42], elL: [-9, -27], elR: [9, -27], haL: [-11, -19], haR: [11, -19], knL: [-5, -10], knR: [5, -10], ftL: [-6, 0], ftR: [6, 0] },
    crouch: { hip: [2, -13], sh: [-2, -25], head: [-1, -34], elL: [-10, -20], elR: [8, -18], haL: [-14, -11], haR: [12, -10], knL: [-9, -7], knR: [10, -7], ftL: [-8, 0], ftR: [8, 0] },
    swing: { hip: [0, -20], sh: [2, -33], head: [3, -42], elL: [6, -44], elR: [10, -40], haL: [8, -54], haR: [13, -50], knL: [-8, -12], knR: [-1, -10], ftL: [-14, -5], ftR: [-7, -2] },
    hang: { hip: [0, -20], sh: [1, -33], head: [1, -42], elL: [4, -44], elR: [8, -42], haL: [8, -54], haR: [11, -52], knL: [-3, -9], knR: [4, -9], ftL: [-5, 0], ftR: [5, 0] },
    cheer: { hip: [0, -19], sh: [0, -33], head: [0, -43], elL: [-11, -42], elR: [11, -42], haL: [-15, -55], haR: [15, -55], knL: [-5, -10], knR: [5, -10], ftL: [-6, 0], ftR: [6, 0] },
    fall: { hip: [0, -18], sh: [-3, -31], head: [-4, -40], elL: [-14, -36], elR: [12, -34], haL: [-20, -28], haR: [18, -26], knL: [-10, -8], knR: [11, -9], ftL: [-17, -2], ftR: [16, -3] },
    dazed: { hip: [0, -18], sh: [1, -31], head: [4, -40], elL: [-8, -25], elR: [10, -25], haL: [-9, -16], haR: [11, -16], knL: [-5, -9], knR: [6, -9], ftL: [-7, 0], ftR: [7, 0] },
  };

  function limb(ctx, from, mid, to, color, width) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = width + 2.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(from[0], from[1]);
    ctx.quadraticCurveTo(mid[0], mid[1], to[0], to[1]);
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  // opts: { pose, rot, squash, scale }  — (x, y) is the feet position.
  function drawSpidey(ctx, x, y, opts = {}) {
    const p = POSES[opts.pose] || POSES.stand;
    ctx.save();
    ctx.translate(x, y);
    if (opts.scale && opts.scale !== 1) ctx.scale(opts.scale, opts.scale);
    if (opts.rot) {
      ctx.translate(0, -24);
      ctx.rotate(opts.rot);
      ctx.translate(0, 24);
    }
    if (opts.squash) {
      ctx.scale(1 + opts.squash * 0.45, 1 - opts.squash * 0.38);
    }

    // Back limbs (darker)
    limb(ctx, p.hip, [(p.hip[0] + p.knR[0]) / 2, p.knR[1]], p.ftR, '#1a3da0', 5);
    limb(ctx, p.sh, p.elR, p.haR, '#b01f1a', 4.6);

    // Torso
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineWidth = 15.5;
    ctx.beginPath();
    ctx.moveTo(p.hip[0], p.hip[1]);
    ctx.lineTo(p.sh[0], p.sh[1]);
    ctx.stroke();
    ctx.strokeStyle = '#e5352c';
    ctx.lineWidth = 12;
    ctx.stroke();
    // Blue waist
    ctx.strokeStyle = '#2456d6';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(p.hip[0], p.hip[1]);
    ctx.lineTo(lerp(p.hip[0], p.sh[0], 0.22), lerp(p.hip[1], p.sh[1], 0.22));
    ctx.stroke();

    // Front limbs
    limb(ctx, p.hip, [(p.hip[0] + p.knL[0]) / 2, p.knL[1]], p.ftL, '#2456d6', 5);
    limb(ctx, p.sh, p.elL, p.haL, '#e5352c', 4.6);

    // Head
    ctx.fillStyle = '#e5352c';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(p.head[0], p.head[1], 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.2;
    [[-3.6, 14], [3.6, -14]].forEach(([dx, deg]) => {
      ctx.save();
      ctx.translate(p.head[0] + dx, p.head[1] - 0.5);
      ctx.rotate((deg * Math.PI) / 180);
      ctx.beginPath();
      ctx.ellipse(0, 0, 2.6, 3.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });

    ctx.restore();
  }

  function spideyHand(x, y, opts = {}) {
    const p = POSES[opts.pose] || POSES.stand;
    const s = opts.scale || 1;
    return { x: x + p.haL[0] * s, y: y + p.haL[1] * s };
  }

  function drawWeb(ctx, ax, ay, hx, hy) {
    const mx = (ax + hx) / 2;
    const my = (ay + hy) / 2 + Math.min(24, Math.hypot(hx - ax, hy - ay) * 0.08);
    ctx.strokeStyle = WEB;
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(mx, my, hx, hy);
    ctx.stroke();
    ctx.fillStyle = WEB;
    ctx.beginPath();
    ctx.arc(ax, ay, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- Particles & bursts ----------

  function drawParticles(ctx, particles) {
    for (const p of particles) {
      const lifeFrac = p.life / p.maxLife;
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.type === 'dust') {
        ctx.globalAlpha = 0.55 * lifeFrac;
        ctx.fillStyle = '#9a8fb8';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * (1.6 - lifeFrac * 0.6), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'confetti') {
        ctx.globalAlpha = Math.min(1, lifeFrac * 2);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if (p.type === 'debris') {
        ctx.globalAlpha = Math.min(1, lifeFrac * 1.5);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.5;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawBurst(ctx, burst, time) {
    const t = burst.t;
    const scaleIn = ease.outBack(Math.min(1, t * 3.2));
    const alpha = t > 0.72 ? Math.max(0, 1 - (t - 0.72) / 0.28) : 1;
    const r = 34 + burst.text.length * 7;

    ctx.save();
    ctx.translate(burst.x, burst.y);
    ctx.rotate(-0.09 + Math.sin(time * 2) * 0.02);
    ctx.scale(scaleIn, scaleIn);
    ctx.globalAlpha = alpha;

    ctx.beginPath();
    const spikes = 12;
    for (let i = 0; i < spikes * 2; i++) {
      const rad = i % 2 === 0 ? r : r * 0.68;
      const ang = (i / (spikes * 2)) * Math.PI * 2;
      const px = Math.cos(ang) * rad * 1.35;
      const py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = burst.bg || '#ffc933';
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.font = '32px Bangers, "Comic Sans MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = INK;
    ctx.strokeText(burst.text, 0, 2);
    ctx.fillStyle = burst.color || '#e5352c';
    ctx.fillText(burst.text, 0, 2);
    ctx.restore();
  }

  return {
    ease,
    lerp,
    hash01,
    PALETTES,
    drawSky,
    drawStreet,
    drawBuilding,
    drawSpidey,
    spideyHand,
    drawWeb,
    drawParticles,
    drawBurst,
  };
})();

  <script>
// Spider-Math game logic — round flow, swing/collapse state machine, input, HUD.
(() => {
  'use strict';

  const R = window.SpiderRender;
  const SFX = window.SFX;
  const QUESTIONS_PER_ROUND = 10;
  const START_LIVES = 3;

  const PHASE_DURATION = {
    idle: Infinity,
    aim: 0.16,
    zip: 0.14,
    swing: 0.8,
    land: 0.38,
    celebrate: 1.0,
    hopdown: 0.55,
    shake: 0.38,
    collapse: 0.85,
    reveal: 1.15,
    reset: 0.6,
    doneWin: Infinity,
    doneLose: Infinity,
  };

  const PRAISE = ['NICE!', 'THWIP!', 'WOW!', 'SUPER!', 'POW!'];
  const OUCH = ['OOPS!', 'CRUNCH!', 'UH-OH!'];

  const els = {
    canvas: document.getElementById('scene'),
    hud: document.getElementById('hud'),
    qLabel: document.getElementById('q-label'),
    questionText: document.getElementById('question-text'),
    lives: document.getElementById('lives'),
    hint: document.getElementById('hint-toast'),
    start: document.getElementById('start-screen'),
    end: document.getElementById('end-screen'),
    endTitle: document.getElementById('end-title'),
    endStars: document.getElementById('end-stars'),
    endScore: document.getElementById('end-score'),
    endMessage: document.getElementById('end-message'),
    btnHome: document.getElementById('btn-home'),
    btnSound: document.getElementById('btn-sound'),
    btnAgain: document.getElementById('btn-again'),
    btnMenu: document.getElementById('btn-menu'),
  };

  const ctx = els.canvas.getContext('2d');

  const game = {
    screen: 'start',
    grade: 1,
    round: [],
    qi: 0,
    lives: START_LIVES,
    correct: 0,
    phase: 'idle',
    t: 0,
    time: 0,
    target: -1,
    isHit: false,
    hover: -1,
    buildingNums: ['', '', ''],
    correctIndex: -1,
    collapse: [0, 0, 0],
    flipT: 1,
    failFrom: null,
    failLand: null,
    particles: [],
    burst: null,
    shakeAmp: 0,
    debrisAcc: 0,
    hintShown: false,
    starTimers: [],
  };

  function clearStarTimers() {
    game.starTimers.forEach(clearTimeout);
    game.starTimers = [];
  }

  let layout = null;

  // ---------- Layout ----------

  function computeLayout() {
    const w = els.canvas.clientWidth;
    const h = els.canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    els.canvas.width = Math.round(w * dpr);
    els.canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const groundY = h - Math.max(52, h * 0.12);
    const hudH = Math.max(els.hud.offsetHeight, Math.min(150, h * 0.26));
    const margin = Math.max(10, w * 0.03);
    const gap = Math.max(12, w * 0.03);
    const bw = Math.min((w - margin * 2 - gap * 2) / 3, 230);
    const startX = (w - (bw * 3 + gap * 2)) / 2;
    const buildable = Math.max(120, groundY - hudH - 40);

    const buildings = [0.78, 0.95, 0.66].map((frac, i) => {
      const bh = Math.max(100, buildable * frac);
      const x = startX + i * (bw + gap);
      return { x, w: bw, h: bh, y: groundY - bh, cx: x + bw / 2, paletteIndex: i };
    });

    layout = {
      w,
      h,
      groundY,
      buildings,
      homeX: w / 2,
      homeY: groundY + (h - groundY) * 0.52,
      spideyScale: Math.max(1, Math.min(1.45, Math.min(w, h) / 620)),
    };
  }

  // Building geometry, accounting for the collapse "crush" (matches render's scale).
  function roofPoint(i) {
    const b = layout.buildings[i];
    const crushH = b.h * (1 - game.collapse[i] * 0.86);
    return { x: b.cx, y: layout.groundY - crushH - 9 };
  }

  function webAnchor(i) {
    const p = roofPoint(i);
    return { x: p.x, y: p.y - 8 };
  }

  const home = () => ({ x: layout.homeX, y: layout.homeY });

  function bezier(p0, p1, p2, t) {
    const u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
      y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y,
    };
  }

  // ---------- HUD ----------

  function renderHearts() {
    els.lives.innerHTML = '';
    for (let i = 0; i < START_LIVES; i++) {
      const span = document.createElement('span');
      span.className = 'heart' + (i < game.lives ? '' : ' lost');
      span.textContent = '❤️';
      els.lives.appendChild(span);
    }
  }

  function loseHeart() {
    game.lives -= 1;
    const heart = els.lives.children[game.lives];
    if (heart) heart.classList.add('lost', 'pop');
  }

  function loadQuestion() {
    const q = game.round[game.qi];
    game.buildingNums = q.choices;
    game.correctIndex = q.choices.indexOf(q.answer);
    els.qLabel.textContent = `Question ${game.qi + 1} of ${game.round.length}`;
    els.questionText.textContent = q.text;
  }

  // ---------- Particles ----------

  function spawnConfetti(x, y) {
    const colors = ['#e5352c', '#2456d6', '#ffc933', '#3ec24f', '#ffffff', '#ff8f3d'];
    for (let i = 0; i < 42; i++) {
      game.particles.push({
        type: 'confetti',
        x, y,
        vx: (Math.random() - 0.5) * 260,
        vy: -60 - Math.random() * 190,
        g: 340,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 12,
        size: 5 + Math.random() * 6,
        color: colors[i % colors.length],
        life: 1.1 + Math.random() * 0.5,
        maxLife: 1.6,
      });
    }
  }

  function spawnCollapseDebris(b, crushTop) {
    const pal = R.PALETTES[b.paletteIndex % R.PALETTES.length];
    game.particles.push({
      type: 'debris',
      x: b.x + Math.random() * b.w,
      y: crushTop + Math.random() * 30,
      vx: (Math.random() - 0.5) * 160,
      vy: -40 + Math.random() * 60,
      g: 620,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 9,
      size: 5 + Math.random() * 10,
      color: Math.random() < 0.5 ? pal.body : pal.shade,
      life: 0.9 + Math.random() * 0.5,
      maxLife: 1.4,
    });
    game.particles.push({
      type: 'dust',
      x: b.x + Math.random() * b.w,
      y: layout.groundY - 4 - Math.random() * 16,
      vx: (Math.random() - 0.5) * 90,
      vy: -12 - Math.random() * 26,
      g: -30,
      rot: 0,
      vr: 0,
      size: 7 + Math.random() * 13,
      color: '',
      life: 0.8 + Math.random() * 0.4,
      maxLife: 1.2,
    });
  }

  function updateParticles(dt) {
    for (const p of game.particles) {
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= dt;
    }
    game.particles = game.particles.filter((p) => p.life > 0);
  }

  // ---------- Round flow ----------

  function startGame(grade) {
    game.grade = grade;
    game.round = window.SpiderQuestions.pickRound(grade, QUESTIONS_PER_ROUND);
    game.qi = 0;
    game.lives = START_LIVES;
    game.correct = 0;
    game.collapse = [0, 0, 0];
    game.particles = [];
    game.burst = null;
    game.flipT = 0;
    game.screen = 'play';
    setPhase('idle');
    els.start.classList.add('hidden');
    els.end.classList.add('hidden');
    els.hud.classList.remove('hidden');
    renderHearts();
    loadQuestion();
    computeLayout();
    try { localStorage.setItem('spidermath.grade', String(grade)); } catch (_) { /* ignore */ }
    if (!game.hintShown) {
      game.hintShown = true;
      els.hint.classList.remove('hidden');
      setTimeout(() => els.hint.classList.add('hidden'), 5000);
    }
  }

  function goHome() {
    game.screen = 'start';
    setPhase('idle');
    game.collapse = [0, 0, 0];
    game.particles = [];
    game.burst = null;
    els.hud.classList.add('hidden');
    els.end.classList.add('hidden');
    els.hint.classList.add('hidden');
    els.start.classList.remove('hidden');
  }

  function endRound(won) {
    game.screen = 'end';
    setPhase(won ? 'doneWin' : 'doneLose');
    els.hud.classList.add('hidden');
    // Unhide before populating: the stars' pop-in animation only starts
    // for elements inserted while the screen is visible.
    els.end.classList.remove('hidden');
    els.endTitle.textContent = won ? 'CITY SAVED!' : 'GAME OVER';
    els.endTitle.style.color = won ? '#3ec24f' : '#e5352c';
    clearStarTimers();
    els.endStars.innerHTML = '';
    if (won) {

      for (let i = 0; i < game.lives; i++) {
        game.starTimers.push(setTimeout(() => {
          if (game.screen !== 'end') return;
          const s = document.createElement('span');
          s.textContent = '⭐';
          els.endStars.appendChild(s);
        }, 350 + i * 280));
      }
    } else {
      els.endStars.textContent = '💥';
    }
    els.endScore.textContent = `You solved ${game.correct} of ${game.round.length}!`;
    els.endMessage.textContent = won
      ? (game.lives === START_LIVES
        ? 'PERFECT! Real superhero math skills!'
        : game.lives === 2 ? 'Awesome swinging, hero!' : 'Phew — that was a close one!')

  function select(i) {
    if (game.screen !== 'play' || game.phase !== 'idle') return;

    game.isHit = i === game.correctIndex;
    game.hover = -1;
    els.hint.classList.add('hidden');
    els.canvas.style.cursor = 'default';
    setPhase('aim');
  }

  function setPhase(name) {
    game.phase = name;
    game.t = 0;
  }

  function onPhaseEnd() {
    switch (game.phase) {
      case 'aim':
        setPhase('zip');
        SFX.thwip();

      case 'zip':

        SFX.whoosh();
        break;
      case 'swing':

          onCorrectLanding();

          SFX.wrong();

      case 'land':
        setPhase('celebrate');
        break;
      case 'celebrate':

        else nextQuestion('hopdown');
        break;
      case 'hopdown':
        setPhase('idle');
        break;
      case 'shake':
        setPhase('collapse');
        onCollapseStart();
        break;
      case 'collapse':
        setPhase('reveal');
        break;
      case 'reveal':
        if (game.lives <= 0) endRound(false);
        else if (game.qi + 1 >= game.round.length) endRound(true);
        else nextQuestion('reset');
        break;
      case 'reset':
        setPhase('idle');
        break;
      default:

    }
  }

  function nextQuestion(phaseName) {
    game.qi += 1;
    loadQuestion();
    game.flipT = 0;
    setPhase(phaseName);
  }

  function onCorrectLanding() {
    game.correct += 1;
    const p = roofPoint(game.target);
    spawnConfetti(p.x, p.y - 20);
    const dir = p.x <= layout.w / 2 ? 1 : -1;
    game.burst = {
      text: PRAISE[Math.floor(Math.random() * PRAISE.length)],
      x: p.x + dir * Math.min(150, layout.w * 0.17),
      y: Math.max(90, p.y - 26),
      t: 0,
      bg: '#ffc933',
      color: '#e5352c',
    };
    SFX.correct();
  }

  function onCollapseStart() {
    loseHeart();
    SFX.crash();
    game.shakeAmp = 9;
    game.failFrom = roofPoint(game.target);
    const b = layout.buildings[game.target];
    const dir = Math.sign(layout.homeX - b.cx) || 1;
    game.failLand = { x: b.cx + dir * (b.w * 0.5 + 30), y: layout.homeY };
    game.burst = {
      text: OUCH[Math.floor(Math.random() * OUCH.length)],
      x: b.cx + dir * Math.min(150, layout.w * 0.17),
      y: Math.max(90, b.y - 40),
      t: 0,
      bg: '#e5352c',
      color: '#fff8ec',
    };
  }

  // ---------- Per-frame update ----------

  function update(dt) {
    game.time += dt;
    game.t += dt;
    if (game.flipT < 1) game.flipT = Math.min(1, game.flipT + dt / 0.45);
    if (game.shakeAmp > 0) game.shakeAmp = Math.max(0, game.shakeAmp - dt * 14);
    updateParticles(dt);
    if (game.burst) {
      game.burst.t += dt / 1.05;
      if (game.burst.t >= 1) game.burst = null;
    }

    if (game.phase === 'collapse') {
      const p = Math.min(1, game.t / PHASE_DURATION.collapse);
      game.collapse[game.target] = R.ease.inQuad(p);
      game.debrisAcc += dt * 26;
      const b = layout.buildings[game.target];
      while (game.debrisAcc >= 1 && game.particles.length < 220) {
        game.debrisAcc -= 1;
        spawnCollapseDebris(b, roofPoint(game.target).y);
      }
      game.shakeAmp = Math.max(game.shakeAmp, 5 * (1 - p));
    } else if (game.phase === 'reset') {
      const p = Math.min(1, game.t / PHASE_DURATION.reset);
      game.collapse[game.target] = 1 - R.ease.outCubic(p);
      if (p >= 1) game.collapse[game.target] = 0;
    }

    const dur = PHASE_DURATION[game.phase];
    if (Number.isFinite(dur) && game.t >= dur) onPhaseEnd();
  }

  // Spidey's current position/pose, derived fresh each frame (safe across resizes).
  function spideyState() {
    const h = home();
    const t = Number.isFinite(PHASE_DURATION[game.phase])
      ? Math.min(1, game.t / PHASE_DURATION[game.phase])
      : 0;

    switch (game.phase) {
      case 'aim':
        return { x: h.x, y: h.y, pose: 'crouch' };
      case 'zip':
        return { x: h.x, y: h.y, pose: 'swing' };
      case 'swing': {
        const target = roofPoint(game.target);
        const p0 = h;
        const p2 = target;
        const p1 = { x: R.lerp(p0.x, p2.x, 0.5), y: p0.y - 14 };
        const pos = bezier(p0, p1, p2, R.ease.inOutQuad(t));
        const dir = Math.sign(p2.x - p0.x) || 1;
        return { x: pos.x, y: pos.y, pose: 'swing', rot: dir * 0.5 * (1 - t) };
      }
      case 'land': {
        const p = roofPoint(game.target);
        return { x: p.x, y: p.y, pose: 'crouch', squash: Math.sin(t * Math.PI) * 0.7 };
      }
      case 'celebrate': {
        const p = roofPoint(game.target);
        const hop = Math.abs(Math.sin(t * Math.PI * 2)) * 9;
        return { x: p.x, y: p.y - hop, pose: 'cheer' };
      }
      case 'hopdown': {
        const p0 = roofPoint(game.target);
        const p1 = { x: R.lerp(p0.x, h.x, 0.5), y: Math.min(p0.y, h.y) - 60 };
        const pos = bezier(p0, p1, h, R.ease.inOutQuad(t));
        return { x: pos.x, y: pos.y, pose: t < 0.85 ? 'fall' : 'stand' };
      }
      case 'shake': {
        const p = roofPoint(game.target);
        return { x: p.x + Math.sin(game.time * 42) * 2.5, y: p.y, pose: 'hang' };
      }
      case 'collapse': {
        const from = game.failFrom || roofPoint(game.target);
        const land = game.failLand || h;
        const px = R.lerp(from.x, land.x, R.ease.outQuad(t));
        const py = R.lerp(from.y, land.y, R.ease.inQuad(t));
        return { x: px, y: py, pose: 'fall', rot: t * Math.PI * 2.5 };
      }
      case 'reveal':
      case 'doneLose':
        return { x: (game.failLand || h).x, y: (game.failLand || h).y, pose: 'dazed' };
      case 'doneWin': {
        const p = roofPoint(game.target);
        const hop = Math.abs(Math.sin(game.time * Math.PI * 2)) * 9;
        return { x: p.x, y: p.y - hop, pose: 'cheer' };
      }
      case 'reset': {
        const from = game.failLand || h;
        const p1 = { x: R.lerp(from.x, h.x, 0.5), y: Math.min(from.y, h.y) - 46 };
        const pos = bezier(from, p1, h, R.ease.inOutQuad(t));
        return { x: pos.x, y: pos.y, pose: t < 0.85 ? 'crouch' : 'stand' };
      }
      default:
        return { x: h.x, y: h.y, pose: 'stand', squash: Math.sin(game.time * 3) * 0.045 };
    }
  }

  // ---------- Render ----------

  function render() {
    const { w, h, groundY, buildings } = layout;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    if (game.shakeAmp > 0.2) {
      ctx.translate((Math.random() - 0.5) * game.shakeAmp, (Math.random() - 0.5) * game.shakeAmp);
    }

    R.drawSky(ctx, w, h, groundY, game.time);
    R.drawStreet(ctx, w, h, groundY);

    const inAction = game.phase !== 'idle';
    buildings.forEach((b, i) => {
      R.drawBuilding(ctx, b, groundY, {
        number: game.buildingNums[i],
        seed: game.qi,
        hover: game.phase === 'idle' && game.screen === 'play' && game.hover === i,
        collapse: game.collapse[i],
        shakeX: game.phase === 'shake' && i === game.target ? Math.sin(game.time * 46) * 4 : 0,
        glow: game.phase === 'reveal' && i === game.correctIndex,
        dimmed: inAction && game.screen === 'play' && i !== game.target
          && !(game.phase === 'reveal' && i === game.correctIndex),
        flip: game.flipT < 1 ? game.flipT : 0,
        time: game.time,
      });
    });

    const sp = spideyState();
    sp.scale = layout.spideyScale;

    if (game.burst) R.drawBurst(ctx, game.burst, game.time);

    if (game.phase === 'zip') {
      const anchor = webAnchor(game.target);
      const hand = R.spideyHand(sp.x, sp.y, sp);
      const p = R.ease.outQuad(Math.min(1, game.t / PHASE_DURATION.zip));
      R.drawWeb(ctx, R.lerp(hand.x, anchor.x, p), R.lerp(hand.y, anchor.y, p), hand.x, hand.y);
    } else if (game.phase === 'swing' || game.phase === 'shake') {
      const anchor = webAnchor(game.target);
      const hand = R.spideyHand(sp.x, sp.y, sp);
      R.drawWeb(ctx, anchor.x, anchor.y, hand.x, hand.y);
    }

    if (game.screen !== 'start') R.drawSpidey(ctx, sp.x, sp.y, sp);
    R.drawParticles(ctx, game.particles);

    ctx.restore();
  }

  // ---------- Input ----------

  function hitTest(x, y) {
    for (let i = 0; i < layout.buildings.length; i++) {
      const b = layout.buildings[i];
      if (x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 26 && y <= layout.groundY + 8) return i;
    }
    return -1;
  }

  function canvasPos(e) {
    const rect = els.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  els.canvas.addEventListener('pointerdown', (e) => {
    const { x, y } = canvasPos(e);
    const i = hitTest(x, y);
    if (i >= 0) select(i);
  });

  els.canvas.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || game.screen !== 'play' || game.phase !== 'idle') return;
    const { x, y } = canvasPos(e);
    game.hover = hitTest(x, y);
    els.canvas.style.cursor = game.hover >= 0 ? 'pointer' : 'default';
  });

  els.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (game.screen !== 'play') return;
    const idx = ['1', '2', '3'].indexOf(e.key);
    if (idx >= 0) select(idx);
  });

  document.addEventListener('pointerdown', () => SFX.unlock(), { once: true });

  // ---------- Buttons ----------

  document.querySelectorAll('.grade-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      SFX.click();
      startGame(Number(btn.dataset.grade));
    });
  });

  els.btnAgain.addEventListener('click', () => { SFX.click(); startGame(game.grade); });
  els.btnMenu.addEventListener('click', () => { SFX.click(); goHome(); });
  els.btnHome.addEventListener('click', () => { SFX.click(); goHome(); });

  function syncSoundIcon() {
    els.btnSound.textContent = SFX.muted ? '🔇' : '🔊';
  }

  els.btnSound.addEventListener('click', () => {
    SFX.toggleMuted();
    syncSoundIcon();
  });

  // ---------- Boot ----------

  window.addEventListener('resize', computeLayout);
  window.addEventListener('orientationchange', () => setTimeout(computeLayout, 120));
  if (document.fonts) {
    if (document.fonts.load) document.fonts.load('40px Bangers');
    if (document.fonts.ready) document.fonts.ready.then(() => computeLayout());
  }

  syncSoundIcon();
  computeLayout();
  renderHearts();

  // Exposed for automated testing only — not used by the game itself.
  window.__spidermath = { game, getLayout: () => layout };

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (game.screen !== 'start') update(dt);
    else game.time += dt;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
